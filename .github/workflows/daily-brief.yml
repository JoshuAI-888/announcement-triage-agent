name: daily-brief

# CONTRACTS.md §10 persistence model:
#   - `main` holds source + runtime_config.json + evals/eval_summary.json +
#     out/run_log.jsonl + out/briefs/*.email.html.
#   - `data-state` (this workflow's own branch) holds state.db + data/raw/ —
#     bulky/binary, restored at the start of each run and committed back after.
#
# `scripts/ci_gate.py` (CONTRACTS §1 schedule block) is the pure decider that turns
# each cron tick into digest / intraday / skip; the *actual* NZT poll time lives in
# runtime_config.json, not here.
#
# The cron is scoped to the ~06:00 NZT digest window instead of firing all day. The
# config is a DAILY digest with intraday OFF, so every tick outside that window was a
# pure "skip" that still spun up a runner (checkout + pip install ≈ 40s) — 95 wasted
# runs/day on a private repo, which exhausts the GitHub Actions minutes allowance and
# then makes GitHub drop scheduled runs / fail them with "runner not acquired".
# 06:00 NZT is 18:00 UTC in NZST (winter) and 17:00 UTC in NZDT (summer); firing at
# :00/:20/:40 of both 17:00 and 18:00 UTC covers the digest tick in either season and
# gives the run 2 extra chances to acquire a runner. 6 runs/day instead of 96 (~16x).
# NOTE: if you re-enable hourly intraday (schedule.poll_frequency="hourly",
# intraday_alerts=true), widen this cron back out (e.g. "7 * * * *" hourly) or intraday
# passes won't fire outside the morning window.
on:
  schedule:
    - cron: "0,20,40 17,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a digest now, bypassing the schedule gate (the dashboard 'Run now' button)"
        type: boolean
        default: true
      as_of_date:
        description: "Backfill: ISO date (UTC) the window ends at, e.g. 2026-08-02. Leave blank for a normal digest."
        type: string
        default: ""
      lookback_days:
        description: "Backfill: number of days to look back from as_of_date. Leave blank to use the configured default."
        type: string
        default: ""

permissions:
  contents: write

# Serialize so a slow run can't overlap the next tick and corrupt state.db /
# double-fire a digest. Queue rather than cancel.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Restore state.db + data/raw from the data-state branch
        run: |
          set -e
          git fetch origin data-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data-state; then
            # Restore each path independently — data-state may carry only state.db
            # (data/raw is bulky and re-fetched on demand), so a missing path must
            # not fail the whole run.
            if git checkout origin/data-state -- state.db 2>/dev/null; then
              git reset -q -- state.db 2>/dev/null || true; echo "restored state.db"
            else echo "no state.db on data-state yet"; fi
            if git checkout origin/data-state -- data/raw 2>/dev/null; then
              git reset -q -- data/raw 2>/dev/null || true; echo "restored data/raw"
            else echo "no data/raw on data-state (re-fetched on demand)"; fi
          else
            echo "no data-state branch yet (first run) — starting fresh; see DEPLOY.md bootstrap"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide action (digest | intraday | skip)
        id: gate
        env:
          # A manual dispatch is "Run now": force a digest immediately, bypassing the
          # schedule gate (empty string = dispatched via API with no inputs → also force).
          FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'false' }}
        run: |
          set -e
          if [ "$FORCE" = "true" ]; then
            echo "action=digest" >> "$GITHUB_OUTPUT"
            echo "reason=forced digest (manual Run now — schedule gate bypassed)" >> "$GITHUB_OUTPUT"
            echo "forced digest via workflow_dispatch"
          else
            RESULT="$(python -m scripts.ci_gate)"
            echo "gate decision: $RESULT"
            ACTION="$(python -c "import json,sys; print(json.loads(sys.argv[1])['action'])" "$RESULT")"
            REASON="$(python -c "import json,sys; print(json.loads(sys.argv[1])['reason'])" "$RESULT")"
            echo "action=$ACTION" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          fi

      - name: Run digest
        if: steps.gate.outputs.action == 'digest'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional market-data key (Twelve Data) for per-item price + 7-day trend.
          # If unset, market lookups return None and the price block is omitted — the
          # run still succeeds (best-effort, see src/market.py).
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Only populated on a workflow_dispatch that filled them in (the dashboard's
          # "Backfill…" control); empty/unset on a schedule trigger or a plain "Run now".
          AS_OF: ${{ github.event.inputs.as_of_date }}
          LOOKBACK: ${{ github.event.inputs.lookback_days }}
        run: |
          set -e
          ARGS=""
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$LOOKBACK" ]; then ARGS="$ARGS --lookback-days $LOOKBACK"; fi
          python -m src.run $ARGS

      - name: Run intraday
        if: steps.gate.outputs.action == 'intraday'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m src.run --intraday

      - name: Skip
        if: steps.gate.outputs.action == 'skip'
        run: |
          echo "skip: ${{ steps.gate.outputs.reason }}"

      - name: Commit run_log.jsonl + pdf_log.jsonl + briefs to main
        if: steps.gate.outputs.action != 'skip'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # pdf_log.jsonl is the PDF/OCR decision log the dashboard reads (same
          # append-only, rebase-friendly treatment as run_log.jsonl).
          # company_profiles.json is the committed per-ticker profile cache — commit it
          # back so a name generated once is never regenerated (and re-paid for) again.
          #
          # Add each path INDEPENDENTLY. `git add a b c` is atomic w.r.t. pathspec
          # errors: if ANY argument matches no file (e.g. out/pdf_log.jsonl on a day
          # with no PDF filing — the common case), git exits non-zero and stages
          # NOTHING, silently dropping the brief + filings artifact + run_log. A
          # per-path loop lets the paths that exist stage regardless of the ones
          # that don't.
          for p in out/run_log.jsonl out/pdf_log.jsonl out/briefs/*.email.html out/filings/*.json data/company_profiles.json; do
            git add "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "no brief/run_log changes to commit"
          else
            git commit -m "chore(ci): ${{ steps.gate.outputs.action }} run $(date -u +%FT%TZ) [skip ci]"
            # A dashboard config-commit can land on main mid-run and make this push
            # non-fast-forward. run_log.jsonl is append-only and briefs are new files,
            # so a rebase applies cleanly on a different path/line — retry a few times.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "push rejected (attempt $i) — rebasing on latest main and retrying"
              git pull --rebase origin main || { git rebase --abort || true; }
              sleep 3
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::failed to push run_log/briefs to main after 5 attempts"; exit 1
            fi
          fi

      # This workflow only triggers on schedule/workflow_dispatch (no `push:` trigger),
      # so the commit above can't retrigger it directly; `[skip ci]` is kept anyway
      # per CONTRACTS.md §10 so any other push-triggered workflow ignores these commits.

      - name: Commit state.db + data/raw to the data-state branch
        if: steps.gate.outputs.action != 'skip'
        run: |
          set -e
          git fetch origin data-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data-state; then
            git worktree add /tmp/data-state-wt origin/data-state
          else
            git worktree add --detach /tmp/data-state-wt
            (cd /tmp/data-state-wt && git checkout --orphan data-state && git rm -rf . >/dev/null 2>&1 || true)
          fi
          mkdir -p /tmp/data-state-wt/data
          cp "$GITHUB_WORKSPACE/state.db" /tmp/data-state-wt/state.db 2>/dev/null || true
          rm -rf /tmp/data-state-wt/data/raw
          cp -r "$GITHUB_WORKSPACE/data/raw" /tmp/data-state-wt/data/raw 2>/dev/null || true
          cd /tmp/data-state-wt
          git checkout -B data-state
          # Vercel's Git integration auto-builds EVERY branch it sees pushed, and it
          # reads git.deploymentEnabled from the PUSHED branch's own vercel.json — not
          # from main's. data-state is an orphan state branch with no dashboard/, so a
          # build here always fails ("Root Directory 'dashboard' does not exist"). Ship
          # a vercel.json ON this branch that disables deploys for it, so Vercel skips
          # the build instead of erroring every run. (main/dashboard is unaffected.)
          echo '{ "$schema": "https://openapi.vercel.sh/vercel.json", "git": { "deploymentEnabled": false } }' > vercel.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no state.db / data/raw changes to commit"
          else
            git commit -m "chore(ci): update state.db + data/raw [skip ci]"
            git push origin data-state
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/data-state-wt --force

# NOTE: no `vercel deploy` step here on purpose. The Vercel project is connected
# to this repo via Vercel's own Git integration, so the `main` commit above (run
# log + brief HTML) triggers Vercel's normal auto-redeploy; the app then reads
# run_log.jsonl / briefs / eval_summary.json live via the GitHub API. See DEPLOY.md.
