exchange:
  reference: "EDGAR"           # NZX | ASX | EDGAR — set at build time
  poll_interval_minutes: 10
  request_timeout_seconds: 30
  rate_limit_requests_per_second: 8    # SEC EDGAR fair-access allows up to 10/sec; 8 leaves headroom
  user_agent: "ATA research prototype - joshuafang@gmail.com"
  bootstrap_lookback_days: 30  # first run only (no watermark yet): how far back to seed

watchlist:
  - AAPL
  - MSFT
  - AMZN
  - GOOGL
  - META
  - NVDA
  - TSLA
  - JPM
  - BAC
  - WMT
  - XOM
  - JNJ
  - PG
  - KO
  - DIS
  - NFLX
  - INTC
  - CSCO
  - PFE
  - T
  # --- top-up draw, added 2026-08-02 -------------------------------------
  # The 20 mega-caps above yield ~84% 424B2 structured-note supplements and
  # insider forms, which cannot fill the SPEC §13.1 clear_material,
  # clear_immaterial or hard_positive slices (see PROGRESS.md human-gate note).
  # These 20 mid-caps run no structured-note programmes: a 90-day index probe
  # returned 0% 424B2 and 75 material-bearing filings (50x 8-K, 20x 10-Q).
  # They must stay in the watchlist permanently or guardrail G4 will drop
  # every gold item drawn from them.
  - LDOS      # defense / industrial — contract awards
  - CACI
  - HII
  - TXT
  - AXON
  - NBIX      # biotech / pharma — regulatory, M&A
  - JAZZ
  - IONS
  - ALKS
  - INCY
  - ZS        # software — guidance changes
  - DDOG
  - HUBS
  - TWLO
  - PATH
  - DECK      # consumer / energy — guidance
  - CROX
  - ULTA
  - FIVE
  - FANG

models:
  primary: "claude-haiku-4-5-20251001"    # bulk classification
  escalation: "claude-opus-4-6"           # low confidence or long documents
  # Escalation was claude-sonnet-5 until 2026-08-02. Sonnet 5 (and every model
  # from Opus 4.7 / Sonnet 5 onward) REJECTS non-default sampling parameters
  # with a 400, so `temperature: 0.0` below made every escalation call fail.
  # Opus 4.6 still accepts temperature, which keeps SPEC §4 valid unamended.
  temperature: 0.0
  max_output_tokens: 1024

pricing_usd_per_mtok:          # verified 2026-08-02 against current Anthropic pricing
  primary_input: 1.00          # claude-haiku-4-5
  primary_output: 5.00
  escalation_input: 5.00       # claude-opus-4-6
  escalation_output: 25.00
fx_usd_nzd: 1.6976             # XE mid-market spot, retrieved 2026-08-02.
                               # Sources spread ~2% on the day (1.6976 XE / 1.7221 / 1.73),
                               # so treat NZD cost figures as +/-2%. Override if your
                               # team standardises on a period average instead of spot.

# --- Provider comparison (added 2026-08-03) ------------------------------------
# Alternative classifier providers, evaluated on the identical gold set + prompt.
# Claude reads the models:/pricing_usd_per_mtok: blocks above (kept for back-compat).
# openai + glm use the OpenAI-compatible client (src/providers.py). Keys come from
# .env via api_key_env — NEVER put a key in this file. Pricing is USD per Mtok.
# FILL the null model ids and pricing before running those providers.
providers:
  claude:
    kind: anthropic
    model: "claude-haiku-4-5-20251001"
    pricing: {input: 1.00, output: 5.00}
  openai:
    kind: openai
    api_key_env: "OPENAI_API_KEY"
    base_url: null                 # default OpenAI endpoint
    model: "gpt-5.6-terra"
    batch_token_param: "max_completion_tokens"   # gpt-5.x rejects max_tokens in the batch body
    batch_omit_temperature: true                 # gpt-5.6-terra only supports the default temperature
    pricing: {input: 2.00, output: 12.00}   # USD/Mtok, provided 2026-08-03
  glm:
    kind: openai
    api_key_env: "GLM_API_KEY"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"   # Zhipu OpenAI-compatible endpoint
    model: "glm-5.1"   # glm-5.2 works live but is NOT batch-supported; 5.1 is both
    batch_endpoint: "/v4/chat/completions"   # Zhipu batch matches glm-5.1 to /v4, not /v1
    # glm-5.x is a reasoning model — without this it spends the whole token budget
    # thinking and returns empty content. Disabled = direct JSON classification.
    extra_body: {thinking: {type: "disabled"}}
    pricing: {input: 1.40, output: 4.40}   # USD/Mtok, provided 2026-08-03

eval:
  # Concurrency for the eval harness (independent of the EDGAR rate limit above).
  # The classify calls are I/O-bound; ~12 parallel workers takes a full run from
  # ~50 min to ~4 min. Lower it if a provider rate-limits you.
  concurrency: 12

normalise:
  # How many raw payloads to turn into canonical records. Selected round-robin
  # across native form types so every form is represented — see src/normalise.py.
  sample_limit: 120

  # --- top-up draw, added 2026-08-02 -------------------------------------
  # pin_file holds the original 120-candidate draw by announcement_id, so
  # candidates.csv row ids 1..120 survive the re-draw unchanged.
  pin_file: "config/candidate_pin.txt"
  # The top-up is drawn per GROUP, each round-robin across its own form types.
  # This is a COVERAGE rule, not a materiality judgement.
  #
  # Why groups rather than one pool: a single round-robin caps 8-K at the same
  # depth as S-8 and SD. The first attempt did exactly that and drew only 12 of
  # 115 available 8-Ks — starving the very slices (clear_material,
  # hard_positive) the top-up exists to fill. Sizing the two ends separately
  # fixes it. Which slice any given row lands in stays the owner's call.
  topup_groups:
    - name: substantive     # where guidance, M&A, contracts, departures appear
      limit: 65
      forms: ["8-K", "8-K/A", "10-Q", "10-K", "DEF 14A", "PRE 14A",
              "SCHEDULE 13D", "SCHEDULE 13D/A", "SC TO-T/A", "425", "S-4"]
    - name: routine         # registration / administrative housekeeping
      limit: 35
      forms: ["S-8", "S-8 POS", "11-K", "SD", "ARS", "DEFA14A"]

thresholds:
  confidence_floor: 0.65        # below this -> coerce to insufficient_info
  escalate_below_confidence: 0.65
  escalate_above_chars: 20000
  truncate_input_chars: 60000   # hard ceiling; log every truncation

ranking:
  materiality_weight:
    material: 1.0
    insufficient_info: 0.4
    immaterial: 0.0
  recency_half_life_hours: 12
  watchlist_weight_default: 1.0

prompt_version: "v3"
